---
- name: Install restic and rclone
  apt:
    name:
      - restic
      - rclone
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure rclone config directory exists
  file:
    path: "{{ rclone_conf_dest | dirname }}"
    state: directory
    mode: "0700"
  when: rclone_conf_src | length > 0

- name: Deploy rclone configuration (pCloud remote)
  copy:
    src: "{{ rclone_conf_src }}"
    dest: "{{ rclone_conf_dest }}"
    mode: "0600"
  when: rclone_conf_src | length > 0

- name: Deploy restic repository password
  copy:
    content: "{{ restic_password }}"
    dest: /root/restic
    mode: "0600"
  when: restic_password | length > 0

- name: Check if restic repository is already initialized
  command: >
    restic -r "{{ restic_repo_base }}/{{ inventory_hostname }}" --password-file /root/restic snapshots
  environment:
    RCLONE_CONFIG: "{{ rclone_conf_dest }}"
  register: restic_snapshots_check
  changed_when: false
  failed_when: false
  when: restic_password | length > 0

- name: Initialize restic repository
  command: >
    restic -r "{{ restic_repo_base }}/{{ inventory_hostname }}" --password-file /root/restic init
  environment:
    RCLONE_CONFIG: "{{ rclone_conf_dest }}"
  when:
    - restic_password | length > 0
    - restic_snapshots_check.rc is defined
    - restic_snapshots_check.rc != 0
