---
- name: Erforderliche System-Pakete installieren
  apt:
    name:
      - python3-apt
      - unattended-upgrades
      - curl
      - git
      - htop
      - vim
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: UFW und Fail2ban entfernen
  apt:
    name:
      - ufw
      - fail2ban
    state: absent
    purge: yes

- name: System-Pakete aktualisieren
  apt:
    upgrade: dist
    cache_valid_time: 3600

- name: Zeitzone setzen
  community.general.timezone:
    name: "{{ server_timezone }}"

# --- Kernel Hardening (sysctl) ---
- name: Kernel-Parameter für Sicherheit optimieren
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
  loop:
    - { name: 'net.ipv4.conf.all.accept_source_route', value: '0' }
    - { name: 'net.ipv4.conf.default.accept_source_route', value: '0' }
    - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.secure_redirects', value: '0' }
    - { name: 'net.ipv4.conf.default.secure_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
    - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
    - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
    - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
    - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }
    - { name: 'net.ipv4.tcp_syncookies', value: '1' }
    - { name: 'net.ipv6.conf.all.disable_ipv6', value: "{{ '1' if disable_ipv6 else '0' }}" }
    - { name: 'net.ipv6.conf.default.disable_ipv6', value: "{{ '1' if disable_ipv6 else '0' }}" }

# --- Shared Memory Hardening ---
- name: /run/shm mit noexec und nosuid mounten
  mount:
    path: /run/shm
    src: tmpfs
    fstype: tmpfs
    opts: "defaults,noexec,nosuid,nodev"
    state: mounted
  ignore_errors: yes # Falls /run/shm nicht existiert oder anders verwaltet wird

# --- SSH-Banner ---
- name: Login-Banner setzen
  copy:
    dest: /etc/issue.net
    content: |
      ***************************************************************************
      *                              WARNUNG                                    *
      *        Dies ist ein privates System. Unbefugter Zugriff verboten.       *
      *        Alle Aktivitäten werden protokolliert.                           *
      ***************************************************************************
    owner: root
    group: root
    mode: '0644'

# --- SSH-Hardening ---
# Übersprungen, wenn der Host/Provider PublicKey-only + PermitRootLogin
# bereits selbst korrekt konfiguriert (manage_ssh_config: false in defaults/main.yml)
- name: sshd_config anpassen (PermitRootLogin, PasswordAuthentication, Port)
  template:
    src: sshd_config_overrides.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: sshd neustarten
  when: manage_ssh_config

# --- Unattended Upgrades ---
- name: Unattended-Upgrades konfigurieren
  template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
  when: unattended_upgrades_enabled

- name: Automatische Update-Checks aktivieren
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  when: unattended_upgrades_enabled
